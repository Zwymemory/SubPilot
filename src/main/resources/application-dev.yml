server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:${SUBPILOT_MYSQL_PORT:3306}/subpilot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: subpilot
    password: subpilot123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: ${SUBPILOT_REDIS_PORT:6379}
      database: 0
      timeout: 3s

  rabbitmq:
    host: localhost
    port: ${SUBPILOT_RABBITMQ_PORT:5672}
    username: guest
    password: guest
    virtual-host: /

  elasticsearch:
    uris: http://localhost:${SUBPILOT_ELASTICSEARCH_PORT:9200}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

subpilot:
  jwt:
    secret: dev-secret-please-change-in-production-dev-secret-32-bytes
    expire-seconds: 604800
